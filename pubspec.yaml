name: world_explorer
description: A Flutter app that shows country info and current weather using REST Countries and Open-Meteo APIs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  intl: ^0.19.0          # For population formatting
  shared_preferences: ^2.2.0   # For search history (E4)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true